    <g stroke="#c9a24a" stroke-width="7" opacity="0.6"><line x1="155" y1="180" x2="155" y2="75"/><line x1="155" y1="180" x2="265" y2="180"/><line x1="155" y1="180" x2="45" y2="180"/><line x1="155" y1="180" x2="155" y2="262"/><line x1="155" y1="180" x2="240" y2="260"/></g>
    <circle cx="155" cy="180" r="30" fill="#fffaf0" stroke="#c9a24a" stroke-width="3"/><text x="155" y="184" font-size="11" text-anchor="middle">Plaza</text>
    <circle cx="155" cy="70" r="30" fill="#3b2e5a"/><text x="155" y="74" font-size="11" fill="#fff" text-anchor="middle">Club</text>
    <circle cx="270" cy="180" r="28" fill="#a9d89b"/><text x="270" y="184" font-size="11" text-anchor="middle">Park</text>
    <circle cx="40" cy="180" r="28" fill="#f3dfa6"/><text x="40" y="184" font-size="11" text-anchor="middle">Beach</text>
    <circle cx="155" cy="265" r="26" fill="#e7f5e1"/><text x="155" y="269" font-size="11" text-anchor="middle">Cafe</text>
    <circle cx="245" cy="265" r="20" fill="#1f2a44"/><text x="245" y="269" font-size="9" fill="#fff" text-anchor="middle">Roof</text>
    <text x="14" y="318" font-size="11" fill="#555">길 찾기 최고 · 막다른 길 5개 · 우연한 만남 적음</text>
  </g>
  <g transform="translate(345,50)">
    <rect width="310" height="330" rx="10" fill="#fff" stroke="#ddd"/>
