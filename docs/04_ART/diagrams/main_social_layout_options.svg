    <ellipse cx="155" cy="180" rx="110" ry="100" fill="none" stroke="#c9a24a" stroke-width="9" opacity="0.6"/>
    <g stroke="#c9a24a" stroke-width="5" opacity="0.5"><line x1="155" y1="180" x2="155" y2="80"/><line x1="155" y1="180" x2="265" y2="180"/><line x1="155" y1="180" x2="45" y2="180"/><line x1="155" y1="180" x2="110" y2="262"/></g>
    <circle cx="155" cy="180" r="28" fill="#fffaf0" stroke="#c9a24a" stroke-width="3"/><text x="155" y="184" font-size="11" text-anchor="middle">Plaza</text>
    <circle cx="155" cy="75" r="30" fill="#3b2e5a"/><text x="155" y="79" font-size="11" fill="#fff" text-anchor="middle">Club</text>
    <circle cx="215" cy="62" r="18" fill="#1f2a44"/><text x="215" y="66" font-size="9" fill="#fff" text-anchor="middle">Roof</text>
    <circle cx="268" cy="180" r="28" fill="#a9d89b"/><text x="268" y="184" font-size="11" text-anchor="middle">Park</text>
