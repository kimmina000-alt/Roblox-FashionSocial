    <line x1="30" y1="180" x2="280" y2="180" stroke="#c9a24a" stroke-width="10" opacity="0.6"/>
    <circle cx="40" cy="180" r="28" fill="#f3dfa6"/><text x="40" y="184" font-size="11" text-anchor="middle">Beach</text>
    <circle cx="275" cy="180" r="28" fill="#fffaf0" stroke="#c9a24a" stroke-width="3"/><text x="275" y="184" font-size="11" text-anchor="middle">Plaza</text>
    <circle cx="200" cy="110" r="28" fill="#3b2e5a"/><text x="200" y="114" font-size="11" fill="#fff" text-anchor="middle">Club</text>
    <circle cx="120" cy="110" r="22" fill="#1f2a44"/><text x="120" y="114" font-size="10" fill="#fff" text-anchor="middle">Roof</text>
    <circle cx="200" cy="250" r="28" fill="#a9d89b"/><text x="200" y="254" font-size="11" text-anchor="middle">Park</text>
    <circle cx="115" cy="250" r="25" fill="#e7f5e1"/><text x="115" y="254" font-size="11" text-anchor="middle">Cafe</text>
